# Simulated gNB + UEs (UERANSIM) that register against the core.
# The chart is rendered through kustomize/ueransim, which adds a gNB liveness
# probe the chart has no values for. Chart version and values stay pinned there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ueransim
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/HarshaDannina/telco-gitops-lab.git
    targetRevision: main
    path: kustomize/ueransim
  destination:
    server: https://kubernetes.default.svc
    namespace: open5gs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
