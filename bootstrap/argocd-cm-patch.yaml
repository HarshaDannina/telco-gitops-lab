# Settings merged into argocd-cm by scripts/bootstrap.sh (kubectl patch --type merge).
data:
  # Report child Application health, so the root app waits for open5gs (wave 0)
  # to be Healthy before it creates ueransim (wave 1). Without it the UEs start
  # while UDR is still waiting for MongoDB, get rejected, and stop retrying.
  # A child only counts once its own sync has finished: right after the sync
  # starts, only the namespace exists and the child briefly reports Healthy.
  # (Assumes the child apps auto-sync; a never-synced child stays Progressing.)
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = "waiting for the app to finish syncing"
    if obj.status == nil then
      return hs
    end
    local op = obj.status.operationState
    if op == nil or op.phase == "Running" or op.phase == "Terminating" then
      return hs
    end
    if op.phase == "Failed" or op.phase == "Error" then
      hs.status = "Degraded"
      hs.message = "sync " .. op.phase
      return hs
    end
    if obj.status.sync == nil or obj.status.sync.status ~= "Synced" then
      return hs
    end
    if obj.status.health ~= nil then
      hs.status = obj.status.health.status
      hs.message = ""
      if obj.status.health.message ~= nil then
        hs.message = obj.status.health.message
      end
    end
    return hs
  # kustomize/ueransim inflates a Helm chart and reads its values file from
  # values/, outside the kustomization directory.
  kustomize.buildOptions: --enable-helm --load-restrictor LoadRestrictionsNone
